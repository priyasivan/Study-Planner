
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📚 Study Planner</h1>
        <p>Plan your day. Achieve your goals.</p>

        <div class="task-input">
            <input type="text" id="taskInput" placeholder="Enter your study task">
            <button onclick="addTask()">Add Task</button>
        </div>

        <div class="task-section">
            <h2>My Study Tasks</h2>
            <ul id="taskList"></ul>
        </div>
       <div class="progress-section">
    <h2>Study Progress</h2>
    <div class="progress-bar">
        <div id="progressFill"></div>
    </div>
    <p id="progressText">0% Completed</p>
</div>
        <div class="summary">
    <p id="taskCount">Total Tasks: 0</p>
    <p id="completedCount">Completed: 0</p>
    <p id="pendingCount">Pending: 0</p>
</div>

    <script src="script.js"></script>
</body>
</html>
